<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OtterOS</title>
  <style>
    :root { --accent: #e67a2e; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", sans-serif;
      color: #f4f4f4;
      background: #000;
      overflow: hidden;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    #lock {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
    }
    #lock[hidden] { display: none; }
    #lock-form { width: min(320px, calc(100vw - 48px)); text-align: center; }
    #lock-title { margin: 0 0 18px; font-weight: 600; letter-spacing: 0.04em; }
    #lock-face {
      width: 72px; height: 72px; margin: 0 auto 12px; border-radius: 50%;
      display: grid; place-items: center; background: var(--accent); font-size: 28px; overflow: hidden;
    }
    #lock-face img { width: 100%; height: 100%; object-fit: cover; }
    #lock-name { margin: 0 0 16px; }
    #lock-password, #lock-form button {
      width: 100%; border: 0; border-radius: 12px; padding: 12px 14px;
    }
    #lock-password { background: rgba(255,255,255,0.08); margin-bottom: 10px; }
    #lock-form button { background: var(--accent); color: #fff; }
    #lock-error { min-height: 1.2em; color: #ffb4b4; font-size: 13px; }
    #desktop {
      position: fixed; inset: 0;
      background: #000 center / cover no-repeat;
    }
    #desktop h1 {
      position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
      margin: 0; font-weight: 600; letter-spacing: 0.08em; opacity: 0.9; pointer-events: none;
    }
    body:not(.show-title) #desktop h1 { display: none; }
    #desktop-icons { position: absolute; inset: 0; }
    .desk-icon {
      position: absolute; width: 92px; border: 0; background: transparent; color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: grab; user-select: none; touch-action: none; border-radius: 10px; padding: 4px 0;
    }
    .desk-icon.dragging { cursor: grabbing; z-index: 3; }
    .desk-icon.selected { background: rgba(255,255,255,0.16); }
    #desktop.grid .desk-icon { width: 70px; gap: 2px; padding: 2px 0 3px; }
    #desktop.grid .desk-icon .glyph { width: 30px; height: 30px; }
    #desktop.grid .desk-icon .glyph svg,
    #desktop.grid .desk-icon .glyph img.site-logo { width: 28px; height: 28px; border-radius: 6px; }
    #desktop.grid .desk-icon span { font-size: 11px; line-height: 1.15; }
    .desk-icon span { font-size: 12px; text-align: center; word-break: break-word; }
    .glyph { width: 42px; height: 42px; display: grid; place-items: center; }
    .glyph svg { width: 40px; height: 40px; }
    .glyph img.site-logo { width: 36px; height: 36px; object-fit: contain; border-radius: 8px; background: #fff; }
    .store-row .glyph { width: 32px; height: 32px; flex: none; }
    .store-row .glyph img.site-logo { width: 28px; height: 28px; border-radius: 7px; }
    .taskbar .icon-btn img.site-logo { width: calc(var(--task-icon, 44px) * 0.58); height: calc(var(--task-icon, 44px) * 0.58); border-radius: 6px; background: #fff; }
    .files-window {
      position: fixed; z-index: 12; display: flex; flex-direction: column;
      width: min(760px, calc(100vw - 48px)); height: min(520px, calc(100vh - 120px));
      left: 50%; top: 46%; transform: translate(-50%, -50%);
      background: rgba(18,18,18,0.78); border: 1px solid rgba(255,255,255,0.22);
      border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      backdrop-filter: blur(24px); overflow: hidden;
    }
    .files-window[hidden] { display: none; }
    .files-title { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: grab; position: relative; z-index: 3; }
    .win-controls { display: flex; gap: 2px; flex: none; }
    .files-window { min-width: 340px; min-height: 240px; }
    .files-window.full {
      left: 0 !important; top: 0 !important; right: 0 !important; bottom: 0 !important;
      width: auto !important; height: auto !important; transform: none !important;
      border-radius: 0; border: 0; box-shadow: none;
    }
    .files-window.full .resize { display: none; }
    .window-pin { box-shadow: 0 0 0 1px rgba(255,255,255,0.35), 0 20px 60px rgba(0,0,0,0.45); }
    .window-pin .win-pin { background: rgba(255,255,255,0.22); }
    .resize { position: absolute; z-index: 4; }
    .resize.n { top: 0; left: 0; right: 0; height: 6px; cursor: ns-resize; z-index: 6; }
    .resize.s { bottom: 0; left: 12px; right: 12px; height: 8px; cursor: ns-resize; }
    .resize.e, .resize.w { top: 42px; bottom: 12px; width: 8px; cursor: ew-resize; }
    .resize.e { right: 0; }
    .resize.w { left: 0; }
    .resize.nw, .resize.ne, .resize.sw, .resize.se { width: 14px; height: 14px; z-index: 6; }
    .resize.nw { top: 0; left: 0; cursor: nwse-resize; }
    .resize.ne { top: 0; right: 0; cursor: nesw-resize; }
    .resize.sw { bottom: 0; left: 0; cursor: nesw-resize; }
    .resize.se { bottom: 0; right: 0; cursor: nwse-resize; }
    .files-title h2 { margin: 0; flex: 1; font-size: 15px; font-weight: 600; }
    .icon-btn, .win-btn {
      width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: inherit;
      display: grid; place-items: center;
    }
    .icon-btn:hover, .win-btn:hover { background: rgba(255,255,255,0.1); }
    .files-toolbar, .app-body { padding: 0 12px 12px; }
    .files-toolbar { display: flex; gap: 8px; }
    .path-label, .store-form input, .command-line input, #editor-text, .setting input[type="text"], .setting input[type="password"] {
      border: 0; border-radius: 10px; background: rgba(255,255,255,0.08); padding: 8px 10px;
    }
    .path-label { flex: 1; }
    #files-body, .store-list { overflow: auto; min-height: 0; flex: 1; }
    .file-row, .store-row {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      border: 0; background: transparent; color: inherit; border-radius: 10px; padding: 8px;
    }
    .file-row:hover, .store-row:hover { background: rgba(255,255,255,0.06); }
    .app-body { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overflow: auto; }
    #editor-text { flex: 1; resize: none; min-height: 0; }
    .command-window { background: rgba(8,10,12,0.94); }
    .command-log {
      flex: 1; margin: 0 12px; overflow: auto; white-space: pre-wrap; font-family: Consolas, monospace; font-size: 13px;
    }
    .command-line { display: flex; gap: 8px; padding: 10px 12px; }
    .command-line input { flex: 1; }
    .web-app-window { width: min(1040px, calc(100vw - 36px)); height: min(740px, calc(100vh - 96px)); }
    .store-window { width: min(1100px, calc(100vw - 28px)); height: min(740px, calc(100vh - 80px)); background: #121212; color: #fff; border-color: #2b2b2b; }
    .web-stage { position: relative; flex: 1; min-height: 0; margin: 0 8px 8px; background: #fff; border-radius: 12px; overflow: hidden; }
    .web-stage webview, .web-stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
    .browser-tabs { display: flex; gap: 4px; align-items: flex-end; padding: 0 10px; overflow: auto; min-height: 36px; }
    .browser-tab { display: flex; align-items: center; max-width: 200px; border-radius: 8px 8px 0 0; background: rgba(255,255,255,0.06); }
    .browser-tab.active { background: rgba(255,255,255,0.16); }
    .browser-tab-label { border: 0; background: transparent; color: inherit; padding: 7px 4px 7px 10px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab-x { border: 0; background: transparent; color: inherit; width: 22px; height: 22px; border-radius: 6px; }
    .tab-x:hover, .browser-bar button:hover { background: rgba(255,255,255,0.12); }
    .browser-bar { display: flex; gap: 6px; align-items: center; padding: 8px 10px; }
    .browser-bar input { flex: 1; border: 0; border-radius: 10px; background: rgba(255,255,255,0.08); padding: 8px 10px; color: inherit; }
    .browser-bar button { width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: inherit; }
    .browser-stage { position: relative; flex: 1; min-height: 0; margin: 0 8px 8px; background: #fff; border-radius: 12px; overflow: hidden; }
    .browser-stage webview, .browser-stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
    .browser-stage webview[hidden], .browser-stage iframe[hidden] { display: none !important; }
    .store-form { display: flex; flex-direction: column; gap: 8px; }
    .store-form button, .store-row button, .settings-actions button, #editor-save {
      border: 0; border-radius: 10px; padding: 8px 12px; background: var(--accent); color: #fff;
    }
    .store-row { background: rgba(255,255,255,0.05); }
    .store-copy { flex: 1; min-width: 0; }
    .store-copy strong, .store-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .store-copy span, #store-note, .hint { opacity: 0.72; font-size: 13px; }
    .store-remove { background: #a33b32 !important; }
    .taskbar {
      position: fixed; left: 0; right: 0; bottom: 0; height: var(--task-h, 64px); z-index: 40;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: 0 12px 2px; border-radius: 0;
      background: rgba(28,28,32,0.62); border: 0; border-top: 1px solid rgba(255,255,255,0.16);
      backdrop-filter: blur(28px) saturate(1.5);
    }
    .task-left, .task-right, .task-center { display: flex; align-items: center; }
    .task-left { justify-content: flex-start; }
    .task-right { justify-content: flex-end; }
    .task-center {
      gap: 4px; padding: 5px 8px; border-radius: 16px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 10px 28px rgba(0,0,0,0.28);
    }
    #task-apps { display: flex; align-items: center; gap: 4px; }
    #task-apps:empty { display: none; }
    #task-apps:not(:empty)::before {
      content: ""; width: 1px; height: 24px; margin: 0 4px;
      background: rgba(255,255,255,0.28);
    }
    .taskbar .icon-btn {
      position: relative; width: var(--task-icon, 44px); height: var(--task-icon, 44px); border-radius: 12px;
      transition: transform 0.12s ease, background 0.12s ease;
    }
    .taskbar .icon-btn svg { width: calc(var(--task-icon, 44px) * 0.5); height: calc(var(--task-icon, 44px) * 0.5); }
    .taskbar .icon-btn:hover { background: rgba(255,255,255,0.14); }
    .task-reveal {
      position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(220px circle at var(--spot-x, -240px) var(--spot-y, -40px), rgba(255,255,255,0.2), transparent 70%);
    }
    .taskbar.spot .task-reveal { opacity: 1; }
    .taskbar > .task-reveal { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    body.task-small { --task-h: 48px; --task-icon: 34px; }
    body.task-large { --task-h: 86px; --task-icon: 58px; }
    body.task-small .task-center { padding: 3px 6px; border-radius: 12px; }
    body.task-large .task-center { padding: 8px 12px; border-radius: 22px; }
    body.task-small .clock-time { font-size: 12px; }
    body.task-large .clock-time { font-size: 16px; }
    body.task-large .clock-date { font-size: 13px; }
    body:not(.task-date) .clock-date { display: none; }
    #task-peek { position: fixed; left: 0; right: 0; bottom: 0; height: 14px; z-index: 86; }
    #task-peek[hidden] { display: none; }
    body.task-hide .taskbar { z-index: 85; transform: translateY(100%); transition: transform 0.18s ease; }
    body.task-hide .taskbar.show { transform: none; }
    .taskbar .icon-btn[aria-expanded="true"]::after,
    .taskbar .task-on::after {
      content: ""; position: absolute; left: 50%; bottom: 3px; width: 14px; height: 3px;
      border-radius: 2px; background: currentColor; transform: translateX(-50%);
    }
    #clock {
      display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
      min-width: 92px; padding: 0 8px 0 12px; line-height: 1.15;
      border: 0; background: transparent; color: inherit;
    }
    .clock-time { font-size: 13px; font-weight: 650; }
    .clock-date { font-size: 11px; opacity: 0.72; }
    .menu {
      position: absolute; bottom: calc(100% + 10px); left: 0; min-width: 180px; padding: 8px;
      background: rgba(20,20,20,0.96); border-radius: 14px; border: 1px solid rgba(255,255,255,0.14);
      display: flex; flex-direction: column; gap: 4px;
    }
    .menu[hidden] { display: none; }
    .menu button, .menu input { border: 0; background: transparent; text-align: left; border-radius: 8px; padding: 8px 10px; }
    .menu button:hover { background: rgba(255,255,255,0.08); }
    .search-panel { width: 320px; }
    .search-panel input { background: rgba(255,255,255,0.08); margin-bottom: 6px; }
    #search-results { max-height: 280px; overflow: auto; }
    .power-wrap { position: relative; }
    #media-stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 8px; }
    #media-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; }
    .accent-row { display: flex; gap: 8px; }
    .accent { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; }
    .accent.selected { border-color: #fff; }
    .choice-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .choice { border: 0; border-radius: 10px; padding: 8px 12px; background: rgba(255,255,255,0.08); color: inherit; }
    .choice.selected { background: var(--accent); color: #fff; }
    .context-menu {
      position: fixed; z-index: 90; min-width: 180px; padding: 6px;
      background: rgba(20,20,20,0.96); border-radius: 12px; border: 1px solid rgba(255,255,255,0.14);
    }
    .context-menu[hidden] { display: none; }
    .context-menu button { display: block; width: 100%; border: 0; background: transparent; text-align: left; border-radius: 8px; padding: 8px 10px; }
    .context-menu button:hover { background: rgba(255,255,255,0.08); }
    .context-menu { max-height: min(70vh, 560px); overflow: auto; }
    .menu-label { padding: 6px 10px 2px; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.62; }
    .menu-rule { height: 1px; margin: 4px 6px; background: rgba(255,255,255,0.12); }
    .ask-layer { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: rgba(0,0,0,0.45); }
    .ask-layer[hidden] { display: none; }
    .ask-card { width: min(440px, calc(100vw - 32px)); padding: 16px; border-radius: 16px; background: rgba(20,20,20,0.98); color: inherit; border: 1px solid rgba(255,255,255,0.16); display: flex; flex-direction: column; gap: 8px; }
    .ask-card h2 { margin: 0; font-size: 16px; }
    .ask-card p { margin: 0; font-size: 13px; opacity: 0.8; }
    .ask-card input { border: 0; border-radius: 10px; background: rgba(255,255,255,0.08); padding: 8px 10px; color: inherit; }
    .ask-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .ask-actions button { border: 0; border-radius: 10px; padding: 8px 12px; background: rgba(255,255,255,0.1); color: inherit; }
    .ask-actions button[type="submit"] { background: var(--accent); color: #fff; }
    body.light .ask-card { background: #fff; color: #1a1a1a; border-color: rgba(0,0,0,0.08); }
    body.light .ask-card input, body.light #lock-password, body.light .path-label, body.light .store-form input,
    body.light .command-line input, body.light #editor-text, body.light .browser-bar input, body.light .search-panel input {
      background: rgba(255,255,255,0.82); color: #141414;
    }
    .file-row.selected { background: rgba(255,255,255,0.1); }
    #media-stage audio, #media-stage video { width: min(100%, 760px); max-height: 100%; }
    body.light { color: #1a1a1a; }
    body.light .files-window, body.light .taskbar, body.light .menu, body.light .context-menu {
      background: rgba(255,255,255,0.78); color: #1a1a1a; border-color: rgba(0,0,0,0.08);
    }
    body.light .task-center { background: rgba(255,255,255,0.72); border-color: rgba(0,0,0,0.08); box-shadow: 0 8px 22px rgba(0,0,0,0.12); }
    body.light #task-apps:not(:empty)::before { background: rgba(0,0,0,0.2); }
    body.light .taskbar .icon-btn:hover { background: rgba(0,0,0,0.06); }
    body.light .path-label, body.light .store-form input, body.light .command-line input, body.light #editor-text,
    body.light #lock-password { background: rgba(0,0,0,0.06); color: #1a1a1a; }
    body.light .command-window { background: #f7f7f7; }
    .store-shell { flex: 1; min-height: 0; display: flex; background: #121212; color: #fff; }
    .store-side { width: 210px; flex: none; display: flex; flex-direction: column; gap: 4px; padding: 14px 10px; background: #18181c; border-right: 1px solid rgba(255,255,255,0.06); }
    .store-side button { border: 0; background: transparent; color: #d0d0d0; text-align: left; border-radius: 6px; padding: 11px 14px; font-weight: 700; }
    .store-side button[aria-selected="true"] { background: rgba(255,255,255,0.08); color: #fff; }
    .store-main { flex: 1; min-width: 0; min-height: 0; overflow: auto; padding: 16px 18px 28px; }
    .store-kicker { margin: 0 0 6px; letter-spacing: 0.14em; text-transform: uppercase; font-size: 12px; font-weight: 700; opacity: 0.8; }
    .store-section-title { margin: 4px 0 12px; font-size: 22px; }
    .store-hero { min-height: 260px; border-radius: 10px; display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; padding: 28px; margin-bottom: 22px; }
    .store-hero h3 { margin: 0 0 8px; font-size: 42px; line-height: 1; }
    .store-hero p { margin: 0 0 16px; max-width: 460px; }
    .store-hero-logo { width: 92px; height: 92px; flex: none; }
    .store-hero-logo img.site-logo { width: 84px; height: 84px; border-radius: 18px; }
    .store-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    .store-card { background: #202026; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-height: 230px; }
    .store-card-art { height: 112px; display: grid; place-items: center; }
    .store-card-art .glyph { width: 64px; height: 64px; }
    .store-card-art img.site-logo { width: 56px; height: 56px; border-radius: 12px; }
    .store-card-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .store-card-body strong { font-size: 15px; }
    .store-card-body span { opacity: 0.72; font-size: 12px; flex: 1; }
    .store-window .store-form { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 8px; margin-bottom: 14px; }
    .store-window .store-form input, .store-window .store-search { background: #202026; color: #fff; border: 0; border-radius: 6px; padding: 12px 14px; }
    .store-window .store-search { width: 100%; margin: 0 0 14px; }
    .store-window .store-form button, .store-get { background: #0074e4; color: #fff; border: 0; border-radius: 4px; padding: 10px 18px; font-weight: 700; }
    .store-get { align-self: flex-start; }
    .store-card-actions { display: flex; gap: 8px; }
    .store-remove { background: transparent !important; color: #ffb4b4 !important; padding: 8px 0 !important; }
    .store-window .store-list { overflow: visible; flex: none; }
    #store-note { min-height: 1.2em; margin: 0 0 10px; }
    body.light .store-window { background: #121212; color: #fff; border-color: #2b2b2b; }
    body.light .store-window .store-form input, body.light .store-window .store-search { background: #202026; color: #fff; }


    :root {
      --glass-fill: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04)), rgba(6, 8, 12, 0.82);
      --glass-line: rgba(255,255,255,0.42);
      --glass-inset: inset 0 1px 0 rgba(255,255,255,0.55), inset 0 -1px 0 rgba(255,255,255,0.08);
      --glass-shadow: 0 18px 50px rgba(0,0,0,0.32);
      --glass-blur: blur(28px) saturate(1.7);
      --move: cubic-bezier(0.22, 0.9, 0.26, 1);
    }
    body.light {
      --glass-fill: linear-gradient(180deg, rgba(255,255,255,0.74), rgba(255,255,255,0.36)), rgba(255,255,255,0.32);
      --glass-line: rgba(255,255,255,0.82);
      --glass-inset: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.25);
      --glass-shadow: 0 18px 40px rgba(0,0,0,0.14);
    }
    .files-window,
    body.light .files-window,
    .command-window,
    body.light .command-window,
    .store-window,
    body.light .store-window,
    .taskbar,
    body.light .taskbar,
    .task-center,
    body.light .task-center,
    .menu,
    body.light .menu,
    .context-menu,
    body.light .context-menu,
    .ask-card,
    body.light .ask-card,
    #lock-form,
    .store-card,
    .store-hero,
    .store-side {
      background: var(--glass-fill);
      color: inherit;
      border: 1px solid var(--glass-line);
      box-shadow: var(--glass-inset), var(--glass-shadow);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
    }
    .files-window { border-radius: 22px; }
    .files-window::before,
    .taskbar::before,
    .menu::before,
    .context-menu::before,
    .ask-card::before,
    #lock-form::before {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 56px;
      border-radius: inherit;

        if (!targetFile) return "";

      el.style.top = rest.y + "px";

      el.style.height = rest.h + "px";
    }

      el.style.pointerEvents = "";

      el.style.zIndex = "";

      el.classList.remove("springing");

        el.style.opacity = "";
        writeRest(el, state.rest);
        paintDock(el, !!state.hiding.keepDock);

      lifts.forEach((item, el) => {
        if (!el.isConnected || el.classList.contains("dragging")) {

        item.vs = scale[1];
        item.y = rise[0];
        item.vy = rise[1];
        el.style.transform = "translateY(" + item.y.toFixed(2) + "px) scale(" + item.s.toFixed(4) + ")";
        const settled = Math.abs(item.s - item.ts) < 0.004 && Math.abs(item.y - item.ty) < 0.2 && Math.abs(item.vs) < 0.02 && Math.abs(item.vy) < 2;

    }

    function paintGlow(root, event) {

    });
    document.querySelector(".taskbar").addEventListener("pointerout", (event) => {

    });

    const hideTimers = new WeakMap();
    function openWindow(windowEl, explicitAnchor) {

        h: Math.max(28, rest.h * 0.62),

        el: windowEl,
        pos: { x: from.x, y: from.y, w: from.w, h: from.h, o: 0 },

    function clampIcon(left, top) {
      const parent = document.getElementById("desktop");
      const width = parent.clientWidth || window.innerWidth;
      const height = parent.clientHeight || window.innerHeight;
      const boxW = settings.grid ? 74 : 100;
      const boxH = settings.grid ? 78 : 120;
      return {
        left: Math.min(Math.max(8, width - boxW), Math.max(8, left)),

    function snapToGrid(left, top) {
      const col = Math.max(0, Math.round((left - 10) / 76));

    function compactGrid() {
      const columns = new Map();
      document.querySelectorAll(".desk-icon").forEach((button) => {
        const spot = snapToGrid(parseFloat(button.style.left) || 10, parseFloat(button.style.top) || 10);
        const key = String(spot.left);
        if (!columns.has(key)) columns.set(key, []);
        columns.get(key).push({ button, top: spot.top, left: spot.left });
      });
      columns.forEach((items) => {
        items.sort((a, b) => a.top - b.top);
        let row = Math.max(0, Math.round((items[0].top - 10) / 80));
        items.forEach((item) => {
          const spot = clampIcon(item.left, 10 + row * 80);
          item.button.style.left = spot.left + "px";
          item.button.style.top = spot.top + "px";
          if (item.button.dataset.name) saveIconSpot(item.button.dataset.name, spot.left, spot.top);
          row += 1;

    function bindIconDrag(button, open) {
      button.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        const rect = button.getBoundingClientRect();
        const drag = {
          pointer: event.pointerId,
          dx: event.clientX - rect.left,
          dy: event.clientY - rect.top,
          startX: event.clientX,
          startY: event.clientY,
          moved: false
        };
        function move(ev) {
          if (ev.pointerId !== drag.pointer) return;
          if (!drag.moved && Math.hypot(ev.clientX - drag.startX, ev.clientY - drag.startY) < 6) return;
          drag.moved = true;
          button.classList.add("dragging");
          const parent = document.getElementById("desktop").getBoundingClientRect();
          const spot = placeIcon(ev.clientX - drag.dx - parent.left, ev.clientY - drag.dy - parent.top);
          button.style.left = spot.left + "px";
          button.style.top = spot.top + "px";
        }
        function up(ev) {
          if (ev.pointerId !== drag.pointer) return;
          document.removeEventListener("pointermove", move);
          document.removeEventListener("pointerup", up);
          button.classList.remove("dragging");
          if (!drag.moved) {
            selectIcon(button);
            return;
          }
          button._draggedAt = Date.now();
          saveIconSpot(button.dataset.name, parseFloat(button.style.left), parseFloat(button.style.top));
        }
        document.addEventListener("pointermove", move);
        document.addEventListener("pointerup", up);
      });
      button.addEventListener("dblclick", (event) => {
        if (button._draggedAt && Date.now() - button._draggedAt < 400) {
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        open();
      });
    }

    function runCommand(typed) {
      const text = typed.trim();
      if (!text.startsWith("#")) return Promise.resolve("Commands start with #. Type #help");
      const body = text.slice(1).trim();
      const splitAt = body.indexOf(" ");
      const name = (splitAt === -1 ? body : body.slice(0, splitAt)).toLowerCase();
      const arg = splitAt === -1 ? "" : body.slice(splitAt + 1).trim();
      if (name === "help") return Promise.resolve("Apps\n#store  #add Name https://example.com  #web https://example.com  #apps  #launch Name\n#google otters\nFiles\n#ls  #cd  #pwd  #open  #read  #write  #mkdir  #delete\nSystem\n#lock  #settings  #files  #clear  #theme light  #restart  #stop");
      if (name === "clear") { document.getElementById("command-log").textContent = "OtterOS terminal\nType #help."; return Promise.resolve(""); }
      if (name === "pwd") return Promise.resolve(pathText(shellCwd));
      if (name === "ls") return listFolder(shellCwd).then((data) => (data.entries || []).map((entry) => (entry.kind === "folder" ? entry.name + "/" : entry.name)).join("\n") || "(empty)").catch(() => "Can't find that folder.");
      if (name === "cd") {
        const rel = !arg || arg === "/" ? "" : arg === ".." ? shellCwd.split("/").slice(0, -1).join("/") : (shellCwd ? shellCwd + "/" : "") + arg;
        return listFolder(rel).then((data) => { shellCwd = data.path || ""; document.getElementById("command-prompt").textContent = shellPrompt(); return pathText(shellCwd); }).catch(() => "Can't find that folder.");
      }
      if (name === "files") { openFiles(arg || ""); return Promise.resolve("Opened " + pathText(arg || "")); }
      if (name === "settings") { openWindow(document.getElementById("settings-window")); return Promise.resolve("Settings"); }
      if (name === "store") { openStore(); return Promise.resolve("App Store"); }
      if (name === "lock") return Promise.resolve("OtterOS is open.");
      if (name === "apps") return listFolder("Apps").then((data) => (data.entries || []).map((entry) => entry.name).join("\n") || "(empty)");
      if (name === "add") {
        const match = arg.match(/^(.*)\s+(\S+)$/);
        if (!match) return Promise.resolve("Use #add YouTube https://youtube.com");
        return addWebApp(match[1], match[2]).then((message) => {
          if (String(message).startsWith("Added ")) openWebApp(match[1].trim(), match[2]);
          return message;
        });
      }
      if (name === "web") {
        const href = normalizeUrl(arg);
        if (!href) return Promise.resolve("Use #web https://example.com");
        openBrowser(href);
        return Promise.resolve("Opened " + href);
      }
      if (name === "google") {
        const href = arg ? "https://www.google.com/search?q=" + encodeURIComponent(arg) : "https://www.google.com";
        openWebApp("Google", href);
        return Promise.resolve(arg ? "Searching " + arg : "Google");
      }
      if (name === "launch") {
        if (!arg) return Promise.resolve("Use #launch and an app name");
        return listFolder("Apps").then((data) => {
          const want = arg.toLowerCase().replace(/\.app$/, "");
          const entry = (data.entries || []).find((item) => item.name.toLowerCase().replace(/\.app$/, "") === want);
          if (!entry) return "No app called " + arg;
          openAppFile("Apps/" + entry.name, entry.name);
          return "Opened " + entry.name.replace(/\.app$/i, "");
        });
      }
      if (name === "open") { if (!arg) return Promise.resolve("Use #open Apps/Name.app"); openByPath(arg); return Promise.resolve("Opened " + arg); }
      if (name === "read") return fetch("/api/text?path=" + encodeURIComponent(arg)).then((response) => response.ok ? response.text() : "Can't read that.");
      if (name === "mkdir") {
        return fetch("/api/create?path=" + encodeURIComponent(shellCwd) + "&kind=folder", { method: "POST" }).then((response) => response.ok ? "Made a folder" : "Couldn't make that folder.");
      }
      if (name === "delete") return fetch("/api/delete?path=" + encodeURIComponent(arg), { method: "POST" }).then((response) => response.ok ? "Moved to the Bin" : "Can't delete that.");
      if (name === "theme") {
        if (arg !== "light" && arg !== "dark") return Promise.resolve("Use #theme light or #theme dark");
        settings.light = arg === "light";
        applySettings(); saveSettings();
        return Promise.resolve(arg === "light" ? "Light mode" : "Dark mode");
      }
      if (name === "calc") {
        if (!/^[\d+\-*/().\s]+$/.test(arg)) return Promise.resolve("Use #calc 2*(4+1)");
        try { return Promise.resolve(String(Function("return (" + arg + ")")())); } catch (error) { return Promise.resolve("Can't work that out"); }
      }
      if (name === "restart") { writeState(); location.reload(); return Promise.resolve("Restarting"); }
      if (name === "stop") {
        writeState();
        fetch("/api/shutdown", { method: "POST" }).catch(() => {});
        return Promise.resolve("Shutting down");
      }
      if (name === "echo") return Promise.resolve(arg);
      return Promise.resolve("Unknown command. Type #help");
    }

    function looksLikeUrl(value) {
      const text = String(value || "").trim();

      if (!text || text.indexOf(" ") >= 0 || text.indexOf("/") === 0 || text.indexOf("\\") >= 0) return false;
      const host = text.split("/")[0];
      const dot = host.lastIndexOf(".");
      return dot > 0 && dot < host.length - 1;
    }
    function shortcutHref(raw) {

      if (!text) return { url: "https://www.google.com" };

        return { path: text.replace(/^OtterOS files\/?/i, "") };

      if (looksLikeUrl(text)) return { url: normalizeUrl(text) || "https://www.google.com" };

      const where = shortcutHref(answer.target);
      const title = fileName.replace(/\.shortcut$/i, "");
      const payload = where.url
        ? { otterShortcut: true, url: where.url, title: title }
        : { otterShortcut: true, target: where.path, title: title };

        method: "POST",
        headers: { "Content-Type": "application/json" },

      const rel = icon.dataset.rel || "";
      const name = icon.dataset.name || "Item";
      const kind = icon.dataset.kind || "file";
      if (icon.dataset.special === "bin") {
        showActions(event.clientX, event.clientY, [
          ["Open", () => openEntry(rel, name, kind)],
          ["Empty Bin", () => fetch("/api/bin/clear", { method: "POST" }).then(() => { desktopStamp = ""; refreshDesktop(); if (!document.getElementById("files-window").hidden && inBinPath(filesRel)) loadFiles("Bin"); })]
        ]);
        return;
      }
      showContext(event.clientX, event.clientY, rel, name, kind);
    });
    document.getElementById("context-menu").addEventListener("contextmenu", (event) => event.preventDefault());
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (askResolve) { finishAsk(null); return; }
      closeContext();
    });
    document.addEventListener("pointerdown", (event) => {
      if (!event.target.closest("#power-wrap")) closeMenu();
      if (!event.target.closest("#search-wrap")) closeSearch();
      if (event.button !== 0) return;
      if (performance.now() - contextOpenAt < 400) return;
      if (!event.target.closest("#context-menu")) closeContext();
    });
    document.getElementById("clock").addEventListener("click", () => {});
    let tasksPage = "open";
    let startupLaunched = false;
    function formatBytes(value) {
      const n = Number(value);
      if (!Number.isFinite(n) || n < 0) return "";
      const units = ["B", "KB", "MB", "GB", "TB"];
      let size = n;
      let index = 0;
      while (size >= 1024 && index < units.length - 1) { size /= 1024; index += 1; }
      return (size >= 10 || index === 0 ? size.toFixed(0) : size.toFixed(1)) + " " + units[index];
    }
    function formatUptime(seconds) {
      const total = Math.max(0, Math.round(Number(seconds) || 0));
      const days = Math.floor(total / 86400);
      const hours = Math.floor((total % 86400) / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      if (days > 0) return days + "d " + hours + "h";
      if (hours > 0) return hours + "h " + minutes + "m";
      return minutes + "m";
    }
    function batteryPlugged(status) {
      return [2, 3, 6, 7, 8, 9].includes(status);
    }
    function paintBattery(data) {
      const button = document.getElementById("battery");
      const level = document.getElementById("battery-level");
      const text = document.getElementById("battery-text");
      if (!button || !level || !text || !data || !Number.isFinite(data.battery)) {
        if (button) button.hidden = true;
        return;
      }
      const percent = Math.max(0, Math.min(100, Math.round(data.battery)));
      const plugged = batteryPlugged(data.batteryStatus);
      button.hidden = false;
      level.setAttribute("width", String((22 * percent) / 100));
      level.setAttribute("fill", percent <= 15 && !plugged ? "#ff5d5d" : "currentColor");
      text.textContent = percent + "%";
      const title = percent + "% " + (plugged ? "plugged in" : "on battery");
      button.title = title;
      button.setAttribute("aria-label", title);
    }
    function runningWindows() {
      return [...document.querySelectorAll(".files-window")].filter((el) => !el.hidden || docked.has(el));
    }
    function renderOpenApps() {
      const host = document.getElementById("task-open");
      if (!host) return;
      host.replaceChildren();
      const title = document.createElement("h3");
      title.className = "store-section-title";
      title.textContent = "Apps open";
      const list = document.createElement("div");
      list.className = "task-list";
      const windows = runningWindows();
      if (!windows.length) {
        const empty = document.createElement("p");
        empty.className = "files-empty";
        empty.textContent = "Nothing is open.";
        host.append(title, empty);
        return;
      }
      windows.forEach((el) => {
        const line = document.createElement("div");
        line.className = "task-row";
        const name = document.createElement("strong");
        name.textContent = (el.querySelector("h2") || {}).textContent || "App";
        const state = document.createElement("span");
        state.textContent = el.hidden ? "Minimised" : "Open";
        const show = document.createElement("button");
        show.type = "button";
        show.textContent = "Show";
        show.addEventListener("click", () => openWindow(el));
        const end = document.createElement("button");
        end.type = "button";
        end.className = "task-end";
        end.textContent = "End";
        end.addEventListener("click", () => {
          closeWindow(el);
          window.setTimeout(renderOpenApps, 220);
        });
        line.append(name, state, show, end);
        list.appendChild(line);
      });
      host.append(title, list);
    }
    function renderStartup() {
      const host = document.getElementById("task-startup");
      if (!host) return;
      host.replaceChildren();
      const title = document.createElement("h3");
      title.className = "store-section-title";
      title.textContent = "Startup apps";
      const note = document.createElement("p");
      note.className = "hint";
      note.textContent = "Checked apps open after you unlock OtterOS.";
      const list = document.createElement("div");
      list.className = "task-list";
      host.append(title, note, list);
      Promise.all([listFolder("Apps").catch(() => ({ entries: [] })), listFolder("desktop").catch(() => ({ entries: [] }))]).then(([apps, desk]) => {
        const rows = [];
        (apps.entries || []).forEach((entry) => {
          if (/\.(app|shortcut)$/i.test(entry.name)) rows.push({ label: entry.name.replace(/\.(app|shortcut)$/i, ""), rel: "Apps/" + entry.name });
        });
        (desk.entries || []).forEach((entry) => {
          if (/\.(app|shortcut)$/i.test(entry.name)) rows.push({ label: entry.name.replace(/\.shortcut$/i, ""), rel: "desktop/" + entry.name });
        });
        if (!rows.length) {
          const empty = document.createElement("p");
          empty.className = "files-empty";
          empty.textContent = "No apps yet. Get some from the App Store.";
          list.appendChild(empty);
          return;
        }
        const chosen = new Set(Array.isArray(settings.startup) ? settings.startup : []);
        rows.forEach((row) => {
          const line = document.createElement("label");
          line.className = "task-row";
          const name = document.createElement("strong");
          name.textContent = row.label;
          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = chosen.has(row.rel);
          input.addEventListener("change", () => {
            const next = new Set(Array.isArray(settings.startup) ? settings.startup : []);
            if (input.checked) next.add(row.rel);
            else next.delete(row.rel);
            settings.startup = [...next];
            saveSettings();
          });
          line.append(name, input);
          list.appendChild(line);
        });
      });
    }
    function healthCard(label, value, percent) {
      const card = document.createElement("section");
      card.className = "set-card";
      const top = document.createElement("div");
      top.className = "health-stat";
      const name = document.createElement("strong");
      name.textContent = label;
      const detail = document.createElement("span");
      detail.textContent = value;
      top.append(name, detail);
      card.appendChild(top);
      if (percent != null) {
        const bar = document.createElement("div");
        bar.className = "meter";
        const fill = document.createElement("i");
        fill.style.width = Math.max(0, Math.min(100, percent)) + "%";
        bar.appendChild(fill);
        card.appendChild(bar);
      }
      return card;
    }
    function paintHealth(data) {
      const host = document.getElementById("task-health");
      if (!host) return;
      host.replaceChildren();
      const title = document.createElement("h3");
      title.className = "store-section-title";
      title.textContent = "Computer health";
      const grid = document.createElement("div");
      grid.className = "health-grid";
      if (!data) {
        const empty = document.createElement("p");
        empty.className = "files-empty";
        empty.textContent = "Couldn't read this computer. Open OtterOS again so the new reader can start.";
        host.append(title, empty);
        return;
      }
      const memoryPercent = data.memoryTotal ? Math.round((data.memoryUsed / data.memoryTotal) * 100) : null;
      const diskPercent = data.diskTotal ? Math.round(((data.diskTotal - data.diskFree) / data.diskTotal) * 100) : null;
      grid.appendChild(healthCard("Processor", data.cpu == null ? "Measuring" : data.cpu + "%", data.cpu));
      if (data.model) {
        const model = document.createElement("p");
        model.className = "hint";
        model.textContent = data.cores ? data.model + " · " + data.cores + " cores" : data.model;
        grid.appendChild(model);
      }
      grid.appendChild(healthCard("Memory", formatBytes(data.memoryUsed) + " of " + formatBytes(data.memoryTotal), memoryPercent));
      if (diskPercent != null) grid.appendChild(healthCard("Drive", formatBytes(data.diskFree) + " free of " + formatBytes(data.diskTotal), diskPercent));
      if (Number.isFinite(data.battery)) {
        const plugged = batteryPlugged(data.batteryStatus);
        grid.appendChild(healthCard("Battery", Math.round(data.battery) + "% " + (plugged ? "plugged in" : "on battery"), data.battery));
      } else {
        grid.appendChild(healthCard("Battery", "No battery found", null));
      }
      grid.appendChild(healthCard(data.hostname || "This PC", "On for " + formatUptime(data.uptime), null));
      host.append(title, grid);
    }
    function refreshHealth() {
      return fetch("/api/health").then((response) => response.ok ? response.json() : null).catch(() => null).then((data) => {
        if (data) paintBattery(data);
        if (tasksPage === "health") paintHealth(data);
        return data;
      });
    }
    function showTasksPage(page) {
      tasksPage = page || "open";
      ["open", "startup", "health"].forEach((name) => {
        const panel = document.getElementById("task-" + name);
        const button = document.getElementById("task-tab-" + name);
        if (panel) panel.hidden = name !== tasksPage;
        if (button) button.setAttribute("aria-selected", name === tasksPage ? "true" : "false");
      });
      if (tasksPage === "open") renderOpenApps();
      if (tasksPage === "startup") renderStartup();
      if (tasksPage === "health") refreshHealth();
    }
    function openTasks(page) {
      openWindow(document.getElementById("tasks-window"));
      showTasksPage(page || tasksPage || "open");
    }
    function launchStartup() {
      if (startupLaunched) return;
      startupLaunched = true;
      const list = Array.isArray(settings.startup) ? settings.startup.slice(0, 12) : [];
      list.forEach((rel, index) => {
        window.setTimeout(() => openByPath(String(rel || "")), 280 + index * 280);
      });
    }
    function paintTaskIcons() {
      const icons = {
        "power-btn": '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v8"></path><path d="M7.2 6.6a7 7 0 1 0 9.6 0"></path></svg>',
        "files-btn": '<svg viewBox="0 0 24 24" width="22" height="22"><path fill="#f0c14d" d="M3.5 7.2A1.7 1.7 0 0 1 5.2 5.5H9l1.8 1.8h8a1.7 1.7 0 0 1 1.7 1.7v8.3a1.7 1.7 0 0 1-1.7 1.7H5.2a1.7 1.7 0 0 1-1.7-1.7V7.2z"/></svg>',
        "settings-btn": '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"></circle><path d="M12 3.2v2.2M12 18.6V21M4.9 6.4l1.6 1.6M17.5 16l1.6 1.6M3.2 12h2.2M18.6 12H21M4.9 17.6l1.6-1.6M17.5 8l1.6-1.6"></path></svg>',
        "store-btn": '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6.5 8h11l-.8 11.2a1.2 1.2 0 0 1-1.2 1.1H8.5a1.2 1.2 0 0 1-1.2-1.1L6.5 8z"></path><path d="M9 8V6.8a3 3 0 0 1 6 0V8"></path></svg>',
        "tasks-btn": '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 9h8M8 12h8M8 15h5"></path></svg>',
        "search-btn": '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"></circle><path d="M16 16.5 20 20.5"></path></svg>'
      };
      Object.keys(icons).forEach((id) => {
        const button = document.getElementById(id);
        if (button) button.innerHTML = icons[id];
      });
    }
    function tick() {
      const clock = document.getElementById("clock");
      let time = clock.querySelector(".clock-time");
      let date = clock.querySelector(".clock-date");
      if (!time || !date) {
        clock.replaceChildren();
        time = document.createElement("span");
        time.className = "clock-time";
        date = document.createElement("span");
        date.className = "clock-date";
        clock.append(time, date);
      }
      const now = new Date();
      time.textContent = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      date.textContent = now.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
      const lockClock = document.getElementById("lock-clock");
      if (lockClock) lockClock.textContent = time.textContent;
    }
    if (window.otterDesktop && window.otterDesktop.onNewTab) {
      window.otterDesktop.onNewTab((url) => {
        if (!/^https?:\/\//i.test(url)) return;
        openBrowser(url);
      });
    }
    window.addEventListener("beforeunload", () => writeState());
    loadState().finally(() => {
      applyProfile();
      applySettings();
      paintTaskIcons();
    document.querySelectorAll(".files-title [aria-label='Close']").forEach((button) => {
      button.classList.add("win-btn", "win-close");
      button.innerHTML = closeSvg;
    });
    const backButton = document.getElementById("files-back");
    if (backButton) backButton.innerHTML = backSvg;
      tick();
      refreshWallpaper();
      refreshDesktop();
      refreshHealth();
      launchStartup();
    });
    setInterval(tick, 1000);
    setInterval(() => {
      const win = document.getElementById("tasks-window");
      if (!win || win.hidden) return;
      if (tasksPage === "open") renderOpenApps();
      if (tasksPage === "health") refreshHealth();
    }, 2000);
    setInterval(refreshHealth, 20000);
    setInterval(refreshWallpaper, 4000);
    setInterval(refreshDesktop, 4000);
  </script>
</body>
</html>
